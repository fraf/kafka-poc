spring:
  application:
    name: kafka-poc-test
  datasource:
#    url: "jdbc:tc:postgresql://localhost:62919/test?loggerLevel=OFF"
    username: "test"
    password: "test"
    driver-class-name: "org.testcontainers.jdbc.ContainerDatabaseDriver" #org.postgresql.Driver
  # Hibernate is disabled because Flyway will manage schema
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: "true"
  flyway:
    enabled: "true"
    locations: "classpath:db/migration"
    user: "test"
    password: "test"
    cleanDisabled: false
  logging:
    level:
      root: "info"
      fr.poc.kafka: "debug"
      org.flywaydb: "debug"
      org.springframework.web: "info"
      org.hibernate: "error"
    config: "src/test/resources/logback-spring-test.xml"
    file:
      name: "logs/kafka-poc-test.log"
    charset:
      console: UTF-8
  kafka:
#    bootstrap-servers: "${spring.embedded.kafka.brokers}"
    producer:
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "org.springframework.kafka.support.serializer.JacksonJsonSerializer"
      properties:
        "[spring.json.add.type.headers]": false
#    consumer:
#      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
#      value-deserializer: "org.springframework.kafka.support.serializer.JacksonJsonDeserializer"
